  <div id="app">
    <header id="main-navigation"></header>
    <main id="main-content">
      <section id="home-section" class="app-section" hidden></section>
      <section id="combat-section" class="app-section">
        <div class="section-header"><div><div class="eyebrow">The Emperor protects</div><h1>Kousha's Table Top</h1><p class="muted">Consulting the machine spirits…</p></div></div>
        <div class="card" style="padding:24px"><h2>Starting application</h2><p class="muted">If this message remains visible, the JavaScript application did not start. The diagnostic panel below will show why.</p></div>
      </section>
      <section id="characters-section" class="app-section" hidden></section>
      <section id="builder-section" class="app-section" hidden></section>
      <section id="dashboard-section" class="app-section" hidden></section>
      <section id="map-section" class="app-section" hidden></section>
      <section id="map-library-section" class="app-section" hidden></section>
      <section id="token-library-section" class="app-section" hidden></section>
      <section id="sounds-section" class="app-section" hidden></section>

    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
  </div>
  <script>
    window.__WG_APP_STARTED__ = false;
    window.addEventListener("error", function(event) {
      if (window.__WG_APP_STARTED__) return;
      var root = document.getElementById("app");
      if (!root) return;
      var msg = event.error && (event.error.stack || event.error.message) || event.message || "Unknown JavaScript error";
      root.insertAdjacentHTML("beforeend", '<div style="position:fixed;inset:auto 16px 16px 16px;z-index:9999;background:#15171c;border:1px solid #a94d4d;color:#e7e2d7;padding:18px;border-radius:8px;font-family:system-ui,sans-serif"><strong style="color:#d56b6b">Application startup error</strong><pre style="white-space:pre-wrap;overflow:auto;margin:10px 0 0">'+String(msg).replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</pre></div>');
    });
    window.addEventListener("unhandledrejection", function(event) {
      if (window.__WG_APP_STARTED__) return;
      var root = document.getElementById("app");
      if (!root) return;
      var reason = event.reason && (event.reason.stack || event.reason.message) || String(event.reason || "Unknown promise rejection");
      root.insertAdjacentHTML("beforeend", '<div style="position:fixed;inset:auto 16px 16px 16px;z-index:9999;background:#15171c;border:1px solid #a94d4d;color:#e7e2d7;padding:18px;border-radius:8px;font-family:system-ui,sans-serif"><strong style="color:#d56b6b">Application startup error</strong><pre style="white-space:pre-wrap;overflow:auto;margin:10px 0 0">'+String(reason).replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</pre></div>');
    });
  </script>
